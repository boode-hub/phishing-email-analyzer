<!doctype html>
<html>
  <head>
    <title>API Test</title>
    <style>
      body {
        font-family: monospace;
        background: #111;
        color: #0f0;
        padding: 20px;
      }
      .log {
        margin: 5px 0;
        padding: 10px;
        background: #222;
        border-radius: 4px;
      }
      .error {
        color: #f44;
      }
      .success {
        color: #4f4;
      }
      input {
        width: 400px;
        padding: 8px;
        margin: 5px;
      }
      button {
        padding: 8px 16px;
        margin: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>API Connectivity Test</h2>
    <p>This tests if your browser can reach VirusTotal and AbuseIPDB APIs.</p>

    <div>
      <label>VirusTotal API Key:</label><br />
      <input type="text" id="vt-key" placeholder="Paste VT API key" />
      <button onclick="testVT()">Test VirusTotal</button>
    </div>

    <div>
      <label>AbuseIPDB API Key:</label><br />
      <input type="text" id="abuse-key" placeholder="Paste AbuseIPDB API key" />
      <button onclick="testAbuse()">Test AbuseIPDB</button>
    </div>

    <div>
      <label>Test IP:</label><br />
      <input type="text" id="test-ip" value="8.8.8.8" />
    </div>

    <h3>Results:</h3>
    <div id="results"></div>

    <script>
      function log(msg, type = "info") {
        const div = document.createElement("div");
        div.className = "log " + type;
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        document.getElementById("results").appendChild(div);
      }

      async function testVT() {
        const key = document.getElementById("vt-key").value.trim();
        const ip = document.getElementById("test-ip").value.trim() || "8.8.8.8";

        if (!key) {
          log("Please enter a VT API key", "error");
          return;
        }

        log("Testing VirusTotal API...");
        log("Key prefix: " + key.substring(0, 8) + "...");
        log("Origin: " + window.location.origin);

        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 10000);

          const response = await fetch(
            `https://www.virustotal.com/api/v3/ip_addresses/${ip}`,
            {
              method: "GET",
              headers: {
                "x-apikey": key,
                Accept: "application/json",
              },
              signal: controller.signal,
            },
          );

          clearTimeout(timeout);
          log(
            "Response status: " + response.status,
            response.ok ? "success" : "error",
          );
          log("Response type: " + response.type);

          // Try to get headers
          const headers = {};
          response.headers.forEach((v, k) => {
            headers[k] = v;
          });
          log("Response headers: " + JSON.stringify(headers));

          if (response.ok) {
            const data = await response.json();
            log(
              "SUCCESS! Data: " +
                JSON.stringify(
                  data.data?.attributes?.last_analysis_stats || {},
                ),
              "success",
            );
          } else {
            const text = await response.text();
            log("Error body: " + text.substring(0, 200), "error");
          }
        } catch (error) {
          log("CATCH ERROR: " + error.name + ": " + error.message, "error");
          log("Error stack: " + error.stack, "error");

          if (error.name === "TypeError" && error.message.includes("fetch")) {
            log(
              "DIAGNOSIS: This is a CORS error. The browser blocked the response because VirusTotal does not send Access-Control-Allow-Origin headers.",
              "error",
            );
            log(
              'SOLUTION: Use the "Open in VirusTotal" link instead, or run the app locally with a proxy server.',
              "error",
            );
          }
        }
      }

      async function testAbuse() {
        const key = document.getElementById("abuse-key").value.trim();
        const ip = document.getElementById("test-ip").value.trim() || "8.8.8.8";

        if (!key) {
          log("Please enter an AbuseIPDB API key", "error");
          return;
        }

        log("Testing AbuseIPDB API...");
        log("Key prefix: " + key.substring(0, 8) + "...");
        log("Origin: " + window.location.origin);

        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 10000);

          const response = await fetch(
            `https://api.abuseipdb.com/api/v2/check?ipAddress=${ip}&maxAgeInDays=90`,
            {
              method: "GET",
              headers: {
                Key: key,
                Accept: "application/json",
              },
              signal: controller.signal,
            },
          );

          clearTimeout(timeout);
          log(
            "Response status: " + response.status,
            response.ok ? "success" : "error",
          );
          log("Response type: " + response.type);

          const headers = {};
          response.headers.forEach((v, k) => {
            headers[k] = v;
          });
          log("Response headers: " + JSON.stringify(headers));

          if (response.ok) {
            const data = await response.json();
            log("SUCCESS! Data: " + JSON.stringify(data.data || {}), "success");
          } else {
            const text = await response.text();
            log("Error body: " + text.substring(0, 200), "error");
          }
        } catch (error) {
          log("CATCH ERROR: " + error.name + ": " + error.message, "error");
          log("Error stack: " + error.stack, "error");

          if (error.name === "TypeError" && error.message.includes("fetch")) {
            log(
              "DIAGNOSIS: This is a CORS error. The browser blocked the response because AbuseIPDB does not send Access-Control-Allow-Origin headers.",
              "error",
            );
            log(
              'SOLUTION: Use the "Open in AbuseIPDB" link instead, or run the app locally with a proxy server.',
              "error",
            );
          }
        }
      }
    </script>
  </body>
</html>
